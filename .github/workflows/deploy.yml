name: Deploy to Timeweb

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Optimize article preview image
        run: |
          if [ -f public/images/IMG_8160.png ]; then
            convert public/images/IMG_8160.png -auto-orient -resize '1600x1600>' -strip -define png:compression-level=9 public/images/IMG_8160.png
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Ensure equipment image is visible and cache-busted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          for name in ['480', '800', '1200']:
              html = html.replace(f'printlab-equipment-{name}.webp', f'printlab-equipment-{name}.webp?v=20260913')
          html = html.replace(
              'alt="Наше оборудование для 3D-печати" class="printer-teaser-photo" loading="lazy"',
              'alt="Наше оборудование для 3D-печати" class="printer-teaser-photo" loading="lazy" onerror="this.onerror=null;this.removeAttribute(\'srcset\');this.src=\'/images/IMG_7738.png?v=20260913\'"'
          )
          p.write_text(html, encoding='utf-8')

          # CSS/JS assets are cached for up to a year. Bump generated URLs
          # after product-page presentation changes.
          for page in Path('dist').rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              text = text.replace('?v=9', '?v=12')
              text = text.replace('?v=10', '?v=12')
              text = text.replace('/js/product-page.js?v=4', '/js/product-page.js?v=6')
              page.write_text(text, encoding='utf-8')
          PY

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./3-d-shop.ru/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
          
          # Trigger deployment for the latest homepage typography changes.
