name: Publish mobile preview

on:
  push:
    branches:
      - "feature/premium-homepage-review"
    paths:
      - "build/**"
      - "public/**"
      - "content/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "premium-preview-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Adapt paths for GitHub Pages project URL
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('dist');
          const prefix = '/print3d-shop-site/';
          function walk(dir) {
            for (const item of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, item.name);
              if (item.isDirectory()) walk(file);
              else if (/\.(html|css|js|json|webmanifest|xml|svg)$/i.test(item.name)) {
                let data = fs.readFileSync(file, 'utf8');
                data = data.replace(/(["'(=:\s])\/(?!\/|print3d-shop-site\/)/g, '$1' + prefix);
                fs.writeFileSync(file, data);
              }
            }
          }
          walk(root);
          fs.writeFileSync(path.join(root, '.nojekyll'), '');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy preview only
        id: deployment
        uses: actions/deploy-pages@v4
